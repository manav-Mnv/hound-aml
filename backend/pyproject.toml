[project]
name = "hound"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Manav_", email = "manavbarad978@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "faker>=40.43.0",
    "falkordb>=1.8.0",
    "fastapi>=0.143.2",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hound = "hound.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
